<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Creando Bellos Momentos</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header>
    <h1>Creando Bellos Momentos</h1>
    <p>Decoración profesional con globos en Chihuahua, México</p>
  </header>



  <!-- Sección de servicios -->
  <section id="servicios">
    <h2>Servicios</h2>
    <ul>
      <li>Baby Showers</li>
      <li>Cumpleaños</li>
      <li>Bodas</li>
      <li>Eventos corporativos</li>
    </ul>
  </section>

  <!-- Sección de galería -->
  <section id="galeria">
    <h2>Galería</h2>
    <p>Algunos de nuestros trabajos recientes:</p>
    <div class="galeria-grid">
      <img src="images/navidad.JPG" alt="Decoración navideña" />
      <img src="images/bello.JPG" alt="Decoración elegante" />
      <!-- Agrega más imágenes si gustas -->
    </div>
  </section>

  <!-- Botón de WhatsApp flotante -->
  <a
    href="https://wa.me/526144532499?text=Hola,%20me%20interesa%20saber%20más%20sobre%20sus%20servicios%20de%20decoración"
    class="whatsapp-float"
    target="_blank"
    title="Chatea con nosotros en WhatsApp"
  >
    <img
      src="https://img.icons8.com/color/48/000000/whatsapp--v1.png"
      alt="WhatsApp"
    />
  </a>

  <!-- Footer -->
  <footer>
    <p>&copy; 2024 Creando Bellos Momentos</p>
  </footer>
</body>
</html>
